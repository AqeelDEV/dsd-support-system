packages:
  - apps/*
  - packages/*

# Install scripts are blocked unless listed here. @scarf/scarf (pulled in
# by swagger-ui-dist) only sends install telemetry. esbuild (pulled in by
# drizzle-kit) gets its binary from a platform package; its script only
# double-checks it.
allowBuilds:
  "@scarf/scarf": false
  esbuild: false

# One version of each shared third-party dependency across the workspace.
catalog:
  "@aws-sdk/client-s3": 3.1143.0
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@eslint/js": 10.0.1
  "@faker-js/faker": 10.6.0
  "@fastify/cookie": 11.1.0
  "@fastify/helmet": 13.1.1
  "@fastify/multipart": 10.1.2
  "@fastify/static": 10.1.5
  "@nestjs/common": 11.2.6
  "@nestjs/core": 11.2.6
  "@nestjs/platform-fastify": 11.2.6
  "@nestjs/swagger": 11.4.7
  "@next/eslint-plugin-next": 16.3.7
  "@node-rs/argon2": 2.2.1
  "@tailwindcss/postcss": 4.3.3
  "@types/eslint-plugin-jsx-a11y": 6.10.1
  "@types/node": 24.19.0
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/supertest": 7.2.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  eslint: 10.11.0
  fastify: 5.11.3
  eslint-plugin-jsx-a11y: 6.10.2
  file-type: 22.1.1
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.12.0
  husky: 9.1.7
  ioredis: 6.0.0
  lint-staged: 17.6.0
  nestjs-pino: 5.2.1
  nestjs-zod: 5.5.0
  next: 16.3.7
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  pg: 8.23.0
  pino: 10.3.1
  pino-http: 11.0.0
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.5
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vitest: 5.0.2
  zod: 4.6.5

peerDependencyRules:
  allowedVersions:
    # jsx-a11y works under ESLint 10 (its rules are exercised by the web
    # apps' lint runs) but hasn't widened its declared peer range yet.
    eslint-plugin-jsx-a11y>eslint: "10"
