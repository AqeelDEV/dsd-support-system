packages:
  - apps/*
  - packages/*

# Install scripts are blocked unless listed here. @scarf/scarf (pulled in
# by swagger-ui-dist) only sends install telemetry. esbuild (pulled in by
# drizzle-kit) gets its binary from a platform package; its script only
# double-checks it. msgpackr-extract (pulled in by bullmq) only builds an
# optional native speed-up; msgpackr falls back to plain JavaScript.
allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  msgpackr-extract: false

# One version of each shared third-party dependency across the workspace.
