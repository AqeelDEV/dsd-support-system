name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint reads the pushed commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Commit messages follow Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from=$PR_BASE; to=$PR_HEAD
          else
            from=$PUSH_BEFORE; to=$PUSH_AFTER
          fi
          # A new branch has no "before"; check its whole history instead.
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            from=$(git rev-list --max-parents=0 "$to")
          fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: OpenAPI document and client are up to date
        run: pnpm openapi:check

      - name: Start PostgreSQL and Redis
        run: docker compose up --detach --wait postgres redis

      - name: Tests (unit and integration, against real PostgreSQL and Redis)
        run: pnpm test

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color postgres redis

  compose-smoke:
    name: Full stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack, as the README says
        run: docker compose up --build --detach --wait

      - name: Check it from the outside
        run: scripts/smoke.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
