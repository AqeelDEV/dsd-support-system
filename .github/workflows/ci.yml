name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag, because a tag can be moved
# to different code after review. The comment names the release it is.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint reads the pushed commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: No dependency with a known high or critical advisory
        # Ignored advisories, each with its reason, are in pnpm-workspace.yaml.
        run: pnpm audit --audit-level high

      - name: Commit messages follow Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from=$PR_BASE; to=$PR_HEAD
          else
            from=$PUSH_BEFORE; to=$PUSH_AFTER
          fi
          # A new branch has no "before"; check its whole history instead.
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            from=$(git rev-list --max-parents=0 "$to")
          fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: OpenAPI document and client are up to date
        run: pnpm openapi:check

      - name: Database schema and migrations agree
        run: pnpm db:check

      - name: Start PostgreSQL, Redis, the object store and Mailpit
        run: docker compose up --detach --wait postgres redis seaweedfs mailpit

      - name: Tests (unit and integration, against the real data stores)
        run: pnpm test

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color postgres redis seaweedfs mailpit

  compose-smoke:
    name: Full stack smoke and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build and start the stack, as the README says
        run: docker compose up --build --detach --wait

      - name: Check it from the outside
        run: scripts/smoke.sh

      - name: Install the browser test runner
        run: |
          pnpm install --frozen-lockfile --filter @dsd/e2e...
          pnpm --filter @dsd/e2e exec playwright install --with-deps chromium

      - name: Browser tests against the running apps
        run: pnpm test:e2e

      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
