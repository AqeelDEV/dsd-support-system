# The whole stack for local use, review and CI:
#
#   docker compose up --build --wait
#
# Every ${VAR:-default} below is a development-only default, so the stack
# runs on a clean machine with no .env file. Override any of them in a .env
# file next to this one (see .env.example). Never reuse these values in a
# real deployment.
#
# Data stores publish uncommon host ports (15432, 16379, 18333) so they
# don't clash with anything already installed on the machine, and so the
# tests and a host-run API can reach them. They stay below 49152 because
# Windows reserves blocks of its dynamic range (49152-65535) for Hyper-V,
# WSL and Docker, which makes binding there fail at random. Override them
# with POSTGRES_PORT, REDIS_PORT and S3_PORT. Everything is bound to
# 127.0.0.1 only.

name: dsd-support

x-db-passwords: &db-passwords
  DSD_MIGRATOR_PASSWORD: ${DSD_MIGRATOR_PASSWORD:-migrator-dev-password}
  DSD_API_PASSWORD: ${DSD_API_PASSWORD:-api-dev-password}
  DSD_WORKER_PASSWORD: ${DSD_WORKER_PASSWORD:-worker-dev-password}

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      <<: *db-passwords
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-password}
      DSD_DATABASE: dsd
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    healthcheck:
      # TCP, not the socket: during first-time initialisation the server
      # listens only on the socket, so this stays unhealthy until the init
      # scripts have finished.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, dsd]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2
    # Queues need durability and must never have keys evicted.
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:${REDIS_PORT:-16379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store for attachments (ADR-0001, ADR-0009).
  # Browsers never talk to it: the API is the only door to the files. The
  # access key becomes its only identity, so anonymous requests are refused.
  # Its S3 port is published on this machine's loopback for the tests.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=dsd-attachments
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dsd-dev-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dsd-dev-secret-key}
    volumes:
      - seaweedfs-data:/data
    ports:
      - 127.0.0.1:${S3_PORT:-18333}:8333
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches every email the system sends. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once per `up`: migrations as dsd_migrator (the only role that may
  # change the schema), then the demo data if the database is empty. The API
  # and worker start only after it succeeds.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://dsd_migrator:${DSD_MIGRATOR_PASSWORD:-migrator-dev-password}@postgres:5432/dsd
      # The demo tickets' files go into the same bucket the API serves.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dsd-dev-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dsd-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://dsd_api:${DSD_API_PASSWORD:-api-dev-password}@postgres:5432/dsd
      REDIS_URL: redis://redis:6379
      # Origins that may send state-changing requests (CSRF): both web apps,
      # and the API itself for Swagger UI.
      TRUSTED_ORIGINS: >-
        http://localhost:${CUSTOMER_WEB_PORT:-3000},http://127.0.0.1:${CUSTOMER_WEB_PORT:-3000},
        http://localhost:${AGENT_WEB_PORT:-3001},http://127.0.0.1:${AGENT_WEB_PORT:-3001},
        http://localhost:${API_PORT:-4000},http://127.0.0.1:${API_PORT:-4000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-never-use-in-production}
      # This stack is served over plain http://localhost, where Safari refuses
      # Secure cookies and Chrome refuses __Host- ones. The API accepts
      # "false" only when every trusted origin is local (ADR-0003).
      COOKIE_SECURE: "false"
      # Only the two web apps' X-Forwarded-For is believed, and they put the
      # browser's real address there (ADR-0010). Requests from anywhere else,
      # including the host through the published port, are taken as they come.
      TRUST_PROXY: 10.250.73.10,10.250.73.11
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dsd-dev-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dsd-dev-secret-key}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-UTC}
    ports:
      # Published for Swagger UI at http://localhost:4000/api/docs. The web
      # apps reach the API over the compose network.
      - 127.0.0.1:${API_PORT:-4000}:4000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://dsd_worker:${DSD_WORKER_PASSWORD:-worker-dev-password}@postgres:5432/dsd
      REDIS_URL: redis://redis:6379
      # Every email goes to Mailpit; read them at http://localhost:8025.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Links in emails open the apps as the browser reaches them.
      CUSTOMER_APP_URL: http://localhost:${CUSTOMER_WEB_PORT:-3000}
      AGENT_APP_URL: http://localhost:${AGENT_WEB_PORT:-3001}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dsd-dev-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dsd-dev-secret-key}
      # AI suggestions run on the offline mock unless .env picks a provider
      # and gives its key (README, "AI-assisted replies"). Empty means unset.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EFFORT: ${LLM_EFFORT:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-mock}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      MOCK_LLM_MODE: ${MOCK_LLM_MODE:-}
      AI_DEBOUNCE_MS: ${AI_DEBOUNCE_MS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not needed to start: an unreachable mail server only delays emails.
      mailpit:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  customer-web:
    build:
      context: .
      target: customer-web
    environment:
      API_INTERNAL_URL: http://api:4000
    networks:
      default:
        # Fixed, so the API can trust exactly this app (TRUST_PROXY above).
        ipv4_address: 10.250.73.10
    ports:
      - 127.0.0.1:${CUSTOMER_WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"

  agent-web:
    build:
      context: .
      target: agent-web
    environment:
      API_INTERNAL_URL: http://api:4000
    networks:
      default:
        ipv4_address: 10.250.73.11
    ports:
      - 127.0.0.1:${AGENT_WEB_PORT:-3001}:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"

# A fixed subnet, so the web apps can have the fixed addresses the API
# trusts. It sits outside Docker's default address pools. Docker hands the
# other services addresses from ip_range only, so none of them can take .10
# or .11 first: the web apps start last, after the API is healthy, and with
# a few more services ahead of them their address would already be gone.
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.73.0/24
          ip_range: 10.250.73.128/25

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
